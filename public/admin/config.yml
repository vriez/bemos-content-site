# Decap CMS configuration — the authoring surface for BemOS Plantoes.
#
# How it works: editors open /admin/, sign in with GitHub, and create/edit
# posts through a form. Decap commits the markdown to `content/` in this repo;
# CI builds and deploys. No code changes, no local setup.
#
# Editorial workflow ("Editorial Workflow" below) gives Decap its own
# draft → in review → ready board that maps to Git branches/PRs. Our published
# site ALSO honors the per-post `status` field and `publishDate` for scheduling
# (see lib/posts.ts) — the two layers compose: use the board to move a post
# through review, set status=published + a future publishDate to schedule it.

backend:
  name: github
  repo: vriez/bemos-content-site
  branch: main
  # OAuth relay that completes GitHub sign-in for Decap. GitHub Pages can't run
  # server code, so this points at a tiny hosted OAuth provider. Provision once
  # (see docs/CMS.md); until then, use the local backend below for editing.
  base_url: https://bemos-decap-oauth.example.com

# Enables `npx decap-server` for local, no-OAuth editing during setup/testing.
# Harmless in production (only active when a decap-server is reachable on :8081).
local_backend: true

# Draft → In review → Ready board, backed by Git branches. Complements the
# per-post `status`/`publishDate` scheduling in the site build.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /bemos-content-site/uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content
    create: true
    format: frontmatter
    # Filename = slug, matching the existing content/*.md convention.
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{fields.status}} · {{fields.publishDate}} · {{title}}'
    sortable_fields: [publishDate, title, status]
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: slug,
          label: Slug,
          widget: string,
          hint: 'URL segment, e.g. "my-first-post". Also becomes the filename.',
        }
      - {
          name: status,
          label: Editorial status,
          widget: select,
          default: draft,
          options:
            - { label: 'Draft', value: draft }
            - { label: 'In review', value: review }
            - { label: 'Published', value: published },
          hint: 'Only "Published" posts go live — and only once the publish date below has passed.',
        }
      - {
          name: publishDate,
          label: Publish date & time,
          widget: datetime,
          format: "yyyy-MM-dd'T'HH:mm:ssXXX",
          hint: 'Set a future time to SCHEDULE: the post auto-publishes on the next rebuild after this moment.',
        }
      - {
          name: tags,
          label: Tags,
          widget: list,
          default: [],
          required: false,
        }
      - {
          name: excerpt,
          label: Excerpt,
          widget: text,
          hint: 'One-line summary shown on the homepage and in metadata.',
        }
      - { name: body, label: Body, widget: markdown }
